<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Routing with an escalation budget</title><desc id="desc">A cheaper first attempt is useful only if the whole path is acceptable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0078bf" stroke-width="1.5"/></marker></defs><rect width="800" height="500" fill="#f2eadb"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="27" fill="#1d1b33" font-weight="700"><tspan x="30" dy="0">Routing with an escalation budget</tspan></text><text x="30" y="73" font-size="16" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">A cheaper first attempt is useful only if the whole path is acceptable.</tspan></text><rect x="34" y="119" width="330" height="100" fill="#0078bf"/><rect x="30" y="115" width="330" height="100" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="145" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Establish eligibility</tspan></text><text x="46" y="175" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Task and capability needs</tspan><tspan x="46" dy="26">Application constraints</tspan></text><path d="M370,165 L420,165" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="434" y="119" width="340" height="100" fill="#0078bf"/><rect x="430" y="115" width="340" height="100" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="446" y="145" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="446" dy="0">Choose + execute a tier</tspan></text><text x="446" y="175" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="446" dy="0">Cost and policy</tspan><tspan x="446" dy="26">Low / middle / high capability</tspan></text><path d="M600,225 L600,270" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="434" y="284" width="340" height="120" fill="#0078bf"/><rect x="430" y="280" width="340" height="120" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="446" y="310" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="446" dy="0">Assess policy outcome</tspan></text><text x="446" y="340" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="446" dy="0">Accept, fail, or escalate</tspan><tspan x="446" dy="26">Quality checks are task-specific</tspan></text><path d="M420,340 L370,340" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="34" y="284" width="330" height="120" fill="#ff48b0"/><rect x="30" y="280" width="330" height="120" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="310" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Bound another attempt</tspan></text><text x="46" y="340" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Money, time, and eligibility</tspan><tspan x="46" dy="26">No unlimited retry chain</tspan></text><text x="30" y="478" font-size="11" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">CONCEPTUAL · ORIGINAL ILLUSTRATION · NOT AN INTERNAL SYSTEM DIAGRAM</tspan></text></g></svg>
