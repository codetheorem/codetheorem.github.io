<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Reuse structure without hiding input</title><desc id="desc">Skills and fingerprinting: areas of work and exploration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0078bf" stroke-width="1.5"/></marker></defs><rect width="800" height="500" fill="#f2eadb"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="27" fill="#1d1b33" font-weight="700"><tspan x="30" dy="0">Reuse structure without hiding input</tspan></text><text x="30" y="73" font-size="16" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">Skills and fingerprinting: areas of work and exploration.</tspan></text><rect x="34" y="114" width="340" height="110" fill="#0078bf"/><rect x="30" y="110" width="340" height="110" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="140" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Recurring prompt structures</tspan></text><text x="46" y="170" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Identify selected stable content</tspan><tspan x="46" dy="26">Explore fingerprints and hashing</tspan></text><path d="M380,165 L420,165" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="434" y="114" width="340" height="110" fill="#0078bf"/><rect x="430" y="110" width="340" height="110" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="446" y="140" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="446" dy="0">Reusable skill / template</tspan></text><text x="446" y="170" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="446" dy="0">Manage recurring instructions</tspan><tspan x="446" dy="26">Versioning is a design concern</tspan></text><path d="M600,230 L600,270" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="434" y="284" width="340" height="110" fill="#0078bf"/><rect x="430" y="280" width="340" height="110" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="446" y="310" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="446" dy="0">Resolve model context</tspan></text><text x="446" y="340" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="446" dy="0">Include required instructions</tspan><tspan x="446" dy="26">Count the expanded input</tspan></text><path d="M420,335 L380,335" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="34" y="284" width="340" height="110" fill="#ff48b0"/><rect x="30" y="280" width="340" height="110" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="310" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Evaluate actual savings</tspan></text><text x="46" y="340" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Identifier size is not input size</tspan><tspan x="46" dy="26">Reuse does not imply fewer tokens</tspan></text><text x="30" y="478" font-size="11" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">CONCEPTUAL · ORIGINAL ILLUSTRATION · NOT AN INTERNAL SYSTEM DIAGRAM</tspan></text></g></svg>
