<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Different caches, different contracts</title><desc id="desc">Ownership boundaries, not a pipeline or enabled-feature checklist.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0078bf" stroke-width="1.5"/></marker></defs><rect width="800" height="500" fill="#f2eadb"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="27" fill="#1d1b33" font-weight="700"><tspan x="30" dy="0">Different caches, different contracts</tspan></text><text x="30" y="73" font-size="16" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">Ownership boundaries, not a pipeline or enabled-feature checklist.</tspan></text><rect x="34" y="114" width="740" height="90" fill="#0078bf"/><rect x="30" y="110" width="740" height="90" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="140" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Gateway / application response reuse</tspan></text><text x="46" y="170" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Exact or semantic answer reuse requires validity and context checks.</tspan></text><rect x="34" y="229" width="740" height="90" fill="#0078bf"/><rect x="30" y="225" width="740" height="90" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="255" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Provider-managed prompt reuse</tspan></text><text x="46" y="285" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Provider rules and usage accounting determine input reuse.</tspan></text><rect x="34" y="344" width="740" height="90" fill="#ff48b0"/><rect x="30" y="340" width="740" height="90" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="370" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Inference-engine state reuse</tspan></text><text x="46" y="400" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Prefix reuse across requests; KV state during sequence generation.</tspan></text><text x="30" y="478" font-size="11" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">CONCEPTUAL · ORIGINAL ILLUSTRATION · NOT AN INTERNAL SYSTEM DIAGRAM</tspan></text></g></svg>
