<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">A request, viewed by responsibility</title><desc id="desc">Policy configuration determines ordering and eligible transformations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0078bf" stroke-width="1.5"/></marker></defs><rect width="800" height="500" fill="#f2eadb"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="27" fill="#1d1b33" font-weight="700"><tspan x="30" dy="0">A request, viewed by responsibility</tspan></text><text x="30" y="73" font-size="16" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">Policy configuration determines ordering and eligible transformations.</tspan></text><rect x="34" y="114" width="340" height="105" fill="#0078bf"/><rect x="30" y="110" width="340" height="105" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="140" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Ingest + analyze</tspan></text><text x="46" y="170" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Messages, tools, settings</tspan><tspan x="46" dy="26">Identify request structure</tspan></text><path d="M380,160 L420,160" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="434" y="114" width="340" height="105" fill="#0078bf"/><rect x="430" y="110" width="340" height="105" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="446" y="140" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="446" dy="0">Apply eligible policies</tspan></text><text x="446" y="170" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="446" dy="0">Context and skills processing</tspan><tspan x="446" dy="26">Consider valid reuse</tspan></text><path d="M600,225 L600,265" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="434" y="279" width="340" height="105" fill="#0078bf"/><rect x="430" y="275" width="340" height="105" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="446" y="305" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="446" dy="0">Route + execute</tspan></text><text x="446" y="335" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="446" dy="0">Eligible model tier</tspan><tspan x="446" dy="26">Escalation / fallback policy</tspan></text><path d="M420,325 L380,325" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="34" y="279" width="340" height="105" fill="#0078bf"/><rect x="30" y="275" width="340" height="105" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="305" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Return + account</tspan></text><text x="46" y="335" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Response and attempts</tspan><tspan x="46" dy="26">Tokens, cost, time, outcomes</tspan></text><text x="30" y="432" font-size="19" fill="#0078bf" font-weight="400"><tspan x="30" dy="0">Measurement spans the request; this is not a fixed call graph.</tspan></text><text x="30" y="478" font-size="11" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">CONCEPTUAL · ORIGINAL ILLUSTRATION · NOT AN INTERNAL SYSTEM DIAGRAM</tspan></text></g></svg>
