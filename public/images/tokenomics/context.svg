<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Context changes need a preservation rule</title><desc id="desc">The smallest request is not necessarily the correct request.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0078bf" stroke-width="1.5"/></marker></defs><rect width="800" height="500" fill="#f2eadb"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="27" fill="#1d1b33" font-weight="700"><tspan x="30" dy="0">Context changes need a preservation rule</tspan></text><text x="30" y="73" font-size="16" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">The smallest request is not necessarily the correct request.</tspan></text><rect x="34" y="114" width="340" height="115" fill="#0078bf"/><rect x="30" y="110" width="340" height="115" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="140" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Separate request parts</tspan></text><text x="46" y="170" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Instructions, history, evidence</tspan><tspan x="46" dy="26">Tool schemas and current task</tspan></text><path d="M380,165 L420,165" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="434" y="114" width="340" height="115" fill="#ff48b0"/><rect x="430" y="110" width="340" height="115" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="446" y="140" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="446" dy="0">Protect required meaning</tspan></text><text x="446" y="170" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="446" dy="0">Constraints, identifiers, units</tspan><tspan x="446" dy="26">Structure and tool contracts</tspan></text><path d="M600,235 L600,270" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="434" y="284" width="340" height="115" fill="#0078bf"/><rect x="430" y="280" width="340" height="115" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="446" y="310" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="446" dy="0">Propose eligible changes</tspan></text><text x="446" y="340" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="446" dy="0">Leave protected parts intact</tspan><tspan x="446" dy="26">Retain original request</tspan></text><path d="M420,335 L380,335" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="34" y="284" width="340" height="115" fill="#0078bf"/><rect x="30" y="280" width="340" height="115" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="310" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Compare outcomes</tspan></text><text x="46" y="340" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Quality and instruction adherence</tspan><tspan x="46" dy="26">Cost and latency, not length alone</tspan></text><text x="30" y="478" font-size="11" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">CONCEPTUAL · ORIGINAL ILLUSTRATION · NOT AN INTERNAL SYSTEM DIAGRAM</tspan></text></g></svg>
