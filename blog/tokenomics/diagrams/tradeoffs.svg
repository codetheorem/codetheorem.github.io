<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Compare costs within acceptable behavior</title><desc id="desc">An engineering objective, not an implemented optimization solver.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0078bf" stroke-width="1.5"/></marker></defs><rect width="800" height="500" fill="#f2eadb"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="27" fill="#1d1b33" font-weight="700"><tspan x="30" dy="0">Compare costs within acceptable behavior</tspan></text><text x="30" y="73" font-size="16" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">An engineering objective, not an implemented optimization solver.</tspan></text><rect x="34" y="114" width="740" height="90" fill="#0078bf"/><rect x="30" y="110" width="740" height="90" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="140" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Candidate policies</tspan></text><text x="46" y="170" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Model tier, context changes, reuse, escalation budget</tspan></text><path d="M400,210 L400,245" fill="none" stroke="#0078bf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="34" y="259" width="225" height="95" fill="#ff48b0"/><rect x="30" y="255" width="225" height="95" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="46" y="285" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="46" dy="0">Quality</tspan></text><text x="46" y="315" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="46" dy="0">Task success</tspan></text><rect x="289" y="259" width="225" height="95" fill="#ff48b0"/><rect x="285" y="255" width="225" height="95" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="301" y="285" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="301" dy="0">Latency</tspan></text><text x="301" y="315" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="301" dy="0">Deadline / tail</tspan></text><rect x="544" y="259" width="230" height="95" fill="#ff48b0"/><rect x="540" y="255" width="230" height="95" fill="#fbf6ec" stroke="#1d1b33" stroke-width="2"/><text x="556" y="285" font-size="20" fill="#1d1b33" font-weight="700"><tspan x="556" dy="0">Reliability</tspan></text><text x="556" y="315" font-size="17" fill="#1d1b33" font-weight="400"><tspan x="556" dy="0">Required constraints</tspan></text><text x="30" y="416" font-size="21" fill="#0078bf" font-weight="700"><tspan x="30" dy="0">Among acceptable policies: compare expected workflow cost.</tspan></text><text x="30" y="478" font-size="11" fill="#5b5670" font-weight="400"><tspan x="30" dy="0">CONCEPTUAL · ORIGINAL ILLUSTRATION · NOT AN INTERNAL SYSTEM DIAGRAM</tspan></text></g></svg>
